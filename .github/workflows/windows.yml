name: Windows preview

on:
  push:
    branches: [main]
    paths:
      - 'Windows/**'
      - 'Tests/Windows/**'
      - 'Scripts/tunnelguard-run.py'
      - '.github/workflows/windows.yml'
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Build native WFP library
        run: |
          cmake -S Windows -B winbuild -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build winbuild --config Release
      - name: Verify Windows packet filtering and rollback
        run: python -B Tests/Windows/check_wfp.py winbuild/Release/tunnelguard_wfp.dll winbuild/Release/tunnelguard_probe.exe
      - name: Package x64 application
        run: |
          python -m pip install 'pyinstaller==6.22.3'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item Scripts/tunnelguard-run.py "$env:RUNNER_TEMP/tunnelguard_runner.py"
          $dll = (Resolve-Path winbuild/Release/tunnelguard_wfp.dll).Path
          python -m PyInstaller --noconfirm --onedir --windowed --uac-admin --name TunnelGuard --paths "$env:RUNNER_TEMP" --add-binary "$dll;." Windows/tunnelguard_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item Windows/README.md dist/TunnelGuard/README.md
          Compress-Archive -Path dist/TunnelGuard -DestinationPath TunnelGuard-Windows-x64.zip
          $hash = (Get-FileHash TunnelGuard-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content TunnelGuard-Windows-x64.zip.sha256 "$hash  TunnelGuard-Windows-x64.zip" -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64ace1c802b6b5 # v7
        with:
          name: TunnelGuard-Windows-x64
          path: |
            TunnelGuard-Windows-x64.zip
            TunnelGuard-Windows-x64.zip.sha256
      - name: Publish Windows prerelease
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME TunnelGuard-Windows-x64.zip TunnelGuard-Windows-x64.zip.sha256 --verify-tag --prerelease --title "TunnelGuard Windows $($env:GITHUB_REF_NAME.Replace('windows-v','')) Preview" --notes-file Windows/README.md
